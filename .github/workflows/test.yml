name: Falsum CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify PowerShell modules parse
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Path windows -Filter *.ps1 -Recurse | ForEach-Object {
            $errs = $null; $toks = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$toks, [ref]$errs)
            if ($errs.Count -gt 0) {
              $errors += "$($_.Name): $($errs.Count) parse errors"
            }
          }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_ }
            exit 1
          }
          Write-Host "All PowerShell modules parse clean."

      - name: Run test harness
        shell: pwsh
        run: |
          cd windows
          pwsh -ExecutionPolicy Bypass -File tests/Test-All.ps1
